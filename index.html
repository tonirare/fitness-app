<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1A1E3A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fitness">
  <title>Fitness</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  </div>

  <main id="view" class="view"></main>

  <div id="timer" class="timer hidden" role="timer" aria-live="off">
    <button class="timer-btn" data-act="timer-minus" aria-label="30 Sekunden weniger">−30</button>
    <div class="timer-main">
      <span class="timer-label">Pause</span>
      <span id="timer-time" class="timer-time">0:00</span>
    </div>
    <button class="timer-btn" data-act="timer-plus" aria-label="30 Sekunden mehr">+30</button>
    <button class="timer-btn timer-x" data-act="timer-stop" aria-label="Timer beenden">✕</button>
  </div>
  <div id="flash" class="flash" aria-hidden="true"></div>

  <nav class="tabbar" aria-label="Hauptmenü">
    <button data-nav="home" aria-label="Start"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Start</span></button>
    <button data-nav="calendar" aria-label="Kalender"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Kalender</span></button>
    <button data-nav="training" class="tab-main" aria-label="Training"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg></button>
    <button data-nav="food" aria-label="Gewicht und Kalorien"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M7.5 10a4.5 4.5 0 0 1 9 0z"/><path d="M12 10l1.5-2.5"/></svg><span>Gewicht</span></button>
    <button data-nav="progress" aria-label="Fortschritt"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg><span>Erfolge</span></button>
  </nav>

  <div id="sheet" class="sheet-wrap hidden"></div>
  <div id="celebrate" class="celebrate hidden"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="js/exercises.js"></script>
  <script src="js/badges.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
